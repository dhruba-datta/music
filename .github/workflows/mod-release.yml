name: Build mod release

on:
  push:
    branches: [mod/self-update]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Install Android components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      - name: Work out version
        id: version
        run: |
          base=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          # Pad to three parts so that 1.5 and 1.5.0 compare correctly against the build number.
          while [ "$(printf '%s' "$base" | tr -cd . | wc -c)" -lt 2 ]; do base="$base.0"; done
          echo "name=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          MOD_VERSION: ${{ steps.version.outputs.name }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          chmod +x gradlew
          ./gradlew assembleUniversalGmsRelease -PmodVersion="$MOD_VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          cp "$apk" Music.apk
          gh release create "v$MOD_VERSION" Music.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Music $MOD_VERSION" \
            --generate-notes \
            --latest
